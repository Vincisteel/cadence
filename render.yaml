# Render blueprint — https://render.com/docs/blueprint-spec
# Deploy: push this repo to GitHub, then Render → New → Blueprint → pick the repo.
services:
  - type: web
    name: cadence
    runtime: docker
    plan: starter            # free tier spins down after 15 min idle (slow first hit)
    region: frankfurt        # closest to Switzerland; also: oregon, ohio, singapore, virginia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: CADENCE_CACHE
        value: /data
      - key: CADENCE_MAX_CACHE_BYTES
        value: "3221225472"   # 3 GB
      - key: PYTHONUNBUFFERED
        value: "1"
    disk:
      name: cadence-cache
      mountPath: /data
      sizeGB: 5                # audio cache survives restarts and redeploys
