<div class="app">
  <header class="topbar">
    <a class="brand" href="#" id="brandLink">
      <span class="brand-mark">
        <span></span><span></span><span></span>
      </span>
      <span class="brand-name">Cadence</span>
    </a>

    <div class="searchwrap">
      <svg class="sicon"><use href="#i-search"/></svg>
      <input id="q" type="search" placeholder="Search songs, artists or albums…" autocomplete="off" spellcheck="false" aria-label="Search">
      <kbd>/</kbd>
      <div id="suggest" class="suggest" hidden></div>
    </div>

    <button class="ghost-btn" id="queueToggle" title="Queue (Q)">
      <svg><use href="#i-queue"/></svg><span>Queue</span>
    </button>
  </header>

  <main class="content">
    <section class="view" id="view"></section>

    <aside class="queue-panel" id="queuePanel">
      <div class="queue-head">
        <div>
          <h2 id="queueTitle">Up next</h2>
          <p id="queueSub">Suggestions appear as you listen</p>
        </div>
        <button class="icon-btn" id="clearQueue" title="Clear queue"><svg><use href="#i-close"/></svg></button>
      </div>
      <ol class="queue-list" id="queueList"></ol>
    </aside>
  </main>

  <footer class="player" id="player">
    <div class="np">
      <div class="np-art" id="npArt"><svg><use href="#i-artist"/></svg></div>
      <div class="np-meta">
        <div class="np-title" id="npTitle">Nothing playing</div>
        <div class="np-artist" id="npArtist">Search for a song to begin</div>
      </div>
      <button class="icon-btn in-queue" id="addCurrent" title="Add to queue" hidden><svg><use href="#i-plus"/></svg></button>
    </div>

    <div class="controls">
      <div class="buttons">
        <button class="icon-btn" id="shuffleBtn" title="Shuffle (S)"><svg><use href="#i-shuffle"/></svg></button>
        <button class="icon-btn" id="prevBtn" title="Previous (P)"><svg><use href="#i-prev"/></svg></button>
        <button class="play-btn" id="playBtn" title="Play / pause (Space)"><svg><use href="#i-play"/></svg></button>
        <button class="icon-btn" id="nextBtn" title="Next (N)"><svg><use href="#i-next"/></svg></button>
        <button class="icon-btn" id="repeatBtn" title="Repeat (R)"><svg><use href="#i-repeat"/></svg></button>
      </div>
      <div class="seekrow">
        <span class="t" id="tCur">0:00</span>
        <div class="seekwrap">
          <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Seek">
          <div class="seekfill" id="seekFill"><span></span></div>
        </div>
        <span class="t" id="tDur">0:00</span>
      </div>
    </div>

    <div class="right">
      <div class="spinner" id="spinner" hidden><span></span></div>
      <span class="badge" id="radioBadge" hidden><svg><use href="#i-spark"/></svg>Radio</span>
      <button class="icon-btn" id="muteBtn" title="Mute (M)"><svg><use href="#i-vol"/></svg></button>
      <input type="range" id="vol" class="vol" min="0" max="1" step="0.01" value="0.9" aria-label="Volume">
    </div>
  </footer>
</div>

<audio id="audio" preload="auto" crossorigin="anonymous"></audio>
<div class="toasts" id="toasts"></div>

<script src="/static/app.js"></script>
</body>
</html>
